services:
  api:
    environment:
      HOST: "0.0.0.0"
      OAUTH_CONNECTION: "false"
      APP_URL: http://localhost:8080
      API_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080,http://localhost:3000
      MESSAGING_LIVE_SEND: "false"
      ADS_ACTIONS_LIVE: "false"
      ADS_ACTIONS_PROVIDER_WRITE: "false"
    volumes:
      - ./apps/api/uploads:/app/uploads

  worker:
    environment:
      MESSAGING_LIVE_SEND: "false"
      ADS_ACTIONS_LIVE: "false"
      ADS_ACTIONS_PROVIDER_WRITE: "false"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:8080
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
        API_INTERNAL_URL: http://api:4000
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      API_INTERNAL_URL: http://api:4000
    volumes:
      - ./apps/web/public:/app/apps/web/public:ro
      - ./apps/web/public:/app/public:ro

  nginx:
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  backup:
    profiles:
      - ops

